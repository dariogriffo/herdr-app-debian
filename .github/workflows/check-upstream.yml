name: Check for new herdr-app release

on:
  schedule:
    # Upstream publishes on releases.herdr.dev; its app/latest.json names the
    # current stable build (the GitHub repo only has tags, no releases).
    - cron: "5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: check-upstream
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # required to dispatch release.yml

jobs:
  check:
    name: Compare upstream vs published
    runs-on: ubuntu-latest
    steps:
      - name: Detect and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          VERSION_INPUT="herdr_app_version"

          # Version of the current upstream build, from its release manifest.
          up_ver=$(curl -fsSL https://releases.herdr.dev/app/latest.json | jq -r .version 2>/dev/null || echo "")
          if [ -z "$up_ver" ] || [ "$up_ver" = "null" ]; then
            echo "Could not read https://releases.herdr.dev/app/latest.json; aborting."
            exit 1
          fi
          echo "Upstream: ${up_ver}"

          # Our latest published release is "<ver>+<build>"; 404 -> empty -> build it.
          ours=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" -q .tag_name 2>/dev/null || echo "")
          ours_ver="${ours%%+*}"
          echo "Ours: ${ours:-<none>} -> ${ours_ver:-<none>}"

          if [ "$up_ver" = "$ours_ver" ]; then
            echo "Up to date."
            exit 0
          fi

          # Don't dispatch a duplicate while a build is already running/queued.
          active=$(gh run list --workflow=release.yml --json status \
            -q '[.[] | select(.status == "in_progress" or .status == "queued")] | length')
          if [ "$active" -gt 0 ]; then
            echo "A release.yml run is already active ($active); skipping this tick."
            exit 0
          fi

          echo "New release detected: ${ours_ver:-<none>} -> ${up_ver}. Dispatching build."
          gh workflow run release.yml -f "${VERSION_INPUT}=${up_ver}" -f build_version=1 -f architecture=all
